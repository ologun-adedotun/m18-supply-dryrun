name: other
on:
  workflow_dispatch:

permissions: {}

jobs:
  sign-elsewhere:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMG: ghcr.io/${{ github.repository }}/maright-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: A real signature, from the wrong workflow
        run: |
          docker build -q --build-arg APP_VERSION=other -t "$IMG:other" app && docker push -q "$IMG:other"
          cosign sign --yes "$IMG@$(docker buildx imagetools inspect "$IMG:other" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
