name: build
on:
  workflow_dispatch:

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write       # to sign with the workflow's own identity
      attestations: write   # to record build provenance
    env:
      IMG: ghcr.io/${{ github.repository }}/maright-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Tools, checked against published checksums
        run: bash ci/tools.sh
      - name: No secrets in the repository
        run: |
          gitleaks dir . --redact --no-banner --exit-code 1
          echo "gitleaks found no leaks"
      - name: Vulnerability exceptions are current
        run: python3 ci/check-exceptions.py security/exceptions.yaml /tmp/grype-ignore.yaml
      - name: Build and push
        id: build
        run: |
          docker build -q --build-arg APP_VERSION=v3.0.0 -t "$IMG:v3.0.0" app
          docker push -q "$IMG:v3.0.0"
          echo "digest=$(docker buildx imagetools inspect "$IMG:v3.0.0" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')" >> "$GITHUB_OUTPUT"
      - name: SBOM and the vulnerability gate
        run: |
          syft "$IMG@${{ steps.build.outputs.digest }}" -o spdx-json=sbom.spdx.json -q
          echo "SBOM: $(python3 -c 'import json; d=json.load(open("sbom.spdx.json")); print(d["spdxVersion"], len(d["packages"]), "packages")')"
          grype sbom:sbom.spdx.json -c /tmp/grype-ignore.yaml --only-fixed --fail-on high -q -o table | tail -n 15
          echo "gate passed: no fixable high or critical vulnerability"
      - name: Sign, and attach the SBOM
        run: |
          cosign sign --yes "$IMG@${{ steps.build.outputs.digest }}"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMG@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMG }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Test images (unsigned; signed without an SBOM)
        run: |
          docker build -q --build-arg APP_VERSION=unsigned -t "$IMG:unsigned" app && docker push -q "$IMG:unsigned"
          docker build -q --build-arg APP_VERSION=nosbom -t "$IMG:nosbom" app && docker push -q "$IMG:nosbom"
          cosign sign --yes "$IMG@$(docker buildx imagetools inspect "$IMG:nosbom" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')"
      - name: Gate demonstrations (each is expected to fail)
        run: bash ci/gate-demos.sh
